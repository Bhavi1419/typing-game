<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Typing Arena</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Speed Typing Arena</h1>

    <div class="controls">
      <input type="text" id="player-name" placeholder="Enter your name" maxlength="20" />

      <div class="btn-group">
        <button class="active" data-difficulty="easy">Easy</button>
        <button data-difficulty="medium">Medium</button>
        <button data-difficulty="hard">Hard</button>
      </div>

      <div class="btn-group">
        <button data-duration="15">15s</button>
        <button class="active" data-duration="30">30s</button>
        <button data-duration="60">60s</button>
      </div>

      <button id="restart-btn">New Text</button>
    </div>

    <div class="stats">
      <div>Time: <span id="timer">30s</span></div>
      <div>Speed: <span id="wpm">0</span> WPM</div>
      <div>Accuracy: <span id="accuracy">100%</span></div>
    </div>

    <div id="quote-display" class="quote-box"></div>
    <textarea id="quote-input" rows="4" placeholder="Click here and start typing..."></textarea>
    <p id="status-message">Start typing in the box below to begin the timer...</p>

    <h2>Global Leaderboard</h2>
    <table>
      <thead>
        <tr>
          <th>Rank</th>
          <th>Player</th>
          <th>Speed</th>
          <th>Accuracy</th>
          <th>Mode</th>
        </tr>
      </thead>
      <tbody id="leaderboard-body">
        <tr><td colspan="5">Loading leaderboard...</td></tr>
      </tbody>
    </table>
  </div>

  <script src="script.js?v=2"></script>
</body>
</html>
