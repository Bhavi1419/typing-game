<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Typing Arena</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <div class="container">
    <header class="top-bar">
      <h1>Speed Typing Arena</h1>
      <div class="theme-controls">
        <button class="theme-btn active" data-theme="emerald">Emerald</button>
        <button class="theme-btn" data-theme="cyberpunk">Cyberpunk</button>
        <button class="theme-btn" data-theme="crimson">Crimson</button>
        <button class="theme-btn" data-theme="ocean">Ocean</button>
        <button id="auto-theme-btn" title="Rotate themes every 30s">Auto Theme: ON</button>
      </div>
    </header>

    <div class="controls">
      <input type="text" id="player-name" placeholder="Enter your name..." maxlength="20" />

      <div class="btn-group" aria-label="Difficulty">
        <button class="diff-btn active" data-difficulty="easy">Easy</button>
        <button class="diff-btn" data-difficulty="medium">Medium</button>
        <button class="diff-btn" data-difficulty="hard">Hard</button>
      </div>

      <div class="btn-group" aria-label="Duration">
        <button class="time-btn" data-duration="15">15s</button>
        <button class="time-btn active" data-duration="30">30s</button>
        <button class="time-btn" data-duration="60">60s</button>
      </div>

      <button id="restart-btn">New Text</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <span class="stat-label">TIME LEFT</span>
        <span id="timer" class="stat-value">30s</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">SPEED</span>
        <span id="wpm" class="stat-value">0 WPM</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">ACCURACY</span>
        <span id="accuracy" class="stat-value">100%</span>
      </div>
    </div>

    <div id="quote-display" class="quote-box">Loading paragraph...</div>
    <textarea id="quote-input" rows="4" placeholder="Click here and start typing to begin the race..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
    <p id="status-message">Start typing in the box above to begin the timer...</p>

    <section class="leaderboard-section">
      <h2>Global Cloud Leaderboard (Top 15)</h2>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Rank</th>
              <th>Player</th>
              <th>WPM</th>
              <th>Accuracy</th>
              <th>Mode</th>
              <th>Time</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <tr><td colspan="6">Loading leaderboard from TiDB Cloud...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="script.js?v=4"></script>
</body>
</html>
